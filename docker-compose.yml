services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: remote-browser-backend
    ports:
      - "5000:5000"
    ipc: host # Crucial for Playwright/Chromium to prevent shared memory crashes
    environment:
      - PORT=5000
      - NODE_ENV=development
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: remote-browser-frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:5000
    depends_on:
      - backend
    restart: unless-stopped

